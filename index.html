<script>
(function(){
  var items=[].slice.call(document.querySelectorAll('#slot > *')),i=0,t;
  var HOLD=2000;
  function show(n){
    items.forEach(function(el,k){
      el.classList.toggle('on',k===n);
      if(el.tagName==='VIDEO'){ if(k===n){el.currentTime=0;el.play().catch(function(){});} else {el.pause();} }
    });
  }
  function next(){
    i=(i+1)%items.length; show(i);
    var el=items[i];
    var hold=(el.tagName==='VIDEO' && el.duration && isFinite(el.duration)) ? Math.max(el.duration*1000,HOLD) : HOLD;
    t=setTimeout(next,hold);
  }
  show(0); t=setTimeout(next,HOLD);
})();
</script>
